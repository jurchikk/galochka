<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой список задач — Галочка</title>
  <meta name="description" content="Рабочий список задач Галочки: добавляйте дела, отмечайте выполненные и удаляйте лишнее. Список хранится в вашем браузере.">
  <!-- Эта страница — рабочий инструмент. В поиске показываем главную, поэтому её не индексируем. -->
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../assets/img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="modulepreload" href="../assets/js/todo-ui.js">
  <link rel="modulepreload" href="../assets/js/store.js">
  <link rel="modulepreload" href="../assets/js/theme.js">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('galochka.theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="container topbar">
    <a class="logo" href="../" aria-label="Галочка — на главную">
      <span class="logo__mark" aria-hidden="true"></span>
      Галочка
    </a>
    <a class="btn btn--ghost btn--small" href="../">О сервисе</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="Тёмная тема" aria-pressed="false">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="7.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path fill="currentColor" d="M10 2.8a7.2 7.2 0 0 1 0 14.4z"/></svg>
    </button>
  </header>

  <main class="board">
    <section class="todo" data-todo-root aria-labelledby="todo-title">
      <div class="todo__head">
        <div>
          <h1 class="todo__title" id="todo-title">Мои задачи</h1>
          <p class="todo__date" data-today></p>
        </div>
        <p class="todo__counter" data-todo="counter" aria-live="polite"></p>
      </div>

      <form class="todo__form" data-todo="form" autocomplete="off">
        <label class="visually-hidden" for="new-task">Новая задача</label>
        <input class="todo__input" id="new-task" data-todo="input" type="text" maxlength="200" placeholder="Что нужно сделать?" enterkeyhint="done">
        <button class="btn btn--primary" type="submit">Добавить</button>
      </form>

      <div class="todo__filters" role="group" aria-label="Какие задачи показать">
        <button class="chip" type="button" data-filter="all" aria-pressed="true">Все</button>
        <button class="chip" type="button" data-filter="active" aria-pressed="false">Активные</button>
        <button class="chip" type="button" data-filter="done" aria-pressed="false">Выполненные</button>
      </div>

      <ul class="todo__list" data-todo="list"></ul>
      <p class="todo__empty" data-todo="empty" hidden></p>

      <div class="todo__foot">
        <span class="todo__note todo__note--desktop">Двойной щелчок по задаче — правка</span>
        <button class="link-btn" type="button" data-todo="clear" hidden>Удалить выполненные</button>
      </div>

      <noscript><p class="todo__empty">Чтобы список заработал, включите JavaScript в настройках браузера.</p></noscript>
    </section>

    <p class="board__hint">Задачи хранятся в этом браузере и остаются после обновления страницы.</p>
  </main>

  <div class="toast" data-todo="toast" role="status" aria-live="polite"></div>

  <script type="module" src="../assets/js/board.js"></script>
</body>
</html>
